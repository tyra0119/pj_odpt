<title>交通データ夜景図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 夜景図。テーマは切り替えず、暗い一枚に振り切る */
:root{
  --night:#070C11; --panel:#0E1720; --panel-2:#131F2A; --rule:#1E2E3B;
  --ink:#DCE7EF; --ink-2:#8298A9; --ink-3:#5A6E7E;
  --lit:#4BDBF7;      /* 通年オープン */
  --temp:#F5B855;     /* 期間限定 */
  --alt:#8E7BE0;      /* ODPT外にあり */
  --void:#3C5568;     /* データなし */
}
*{box-sizing:border-box}
body{
  margin:0; overflow:hidden; background:var(--night); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ── ヘッダ ── */
header{
  display:flex; align-items:flex-end; gap:1.4rem; flex-wrap:wrap;
  padding:1rem 1.4rem .85rem; border-bottom:1px solid var(--rule); background:var(--panel);
}
.brand h1{font-size:1.15rem; font-weight:700; margin:0; letter-spacing:.04em}
.brand p{margin:.1rem 0 0; font-size:.72rem; color:var(--ink-3); letter-spacing:.04em}
/* ── 地図 ── */
#map{display:block; width:100%; height:calc(100vh - 84px); min-height:320px;
     background:var(--night); cursor:grab; touch-action:none}
#map.drag{cursor:grabbing}

.overlay{position:absolute; z-index:2}
.card{
  background:rgba(14,23,32,.93); border:1px solid var(--rule); border-radius:3px;
  backdrop-filter:blur(6px);
}

/* ── 左の内訳パネル ── */
.stage{display:flex; align-items:stretch}
#side{
  width:19rem; flex:none; overflow-y:auto; overflow-x:hidden; padding:.75rem .9rem 1rem;
  background:var(--panel-2); border-right:1px solid var(--rule);
}
.mapwrap{position:relative; flex:1 1 auto; min-width:0}
#side h2{
  font-size:.64rem; letter-spacing:.13em; color:var(--ink-3);
  margin:0 0 .45rem; font-weight:500;
}
#side h2.mt{margin-top:.85rem}

/* 所在のキー（色の凡例。クリックで絞り込み） */
#statuskeys{display:flex; flex-wrap:wrap; gap:.25rem}
.skey{
  display:inline-flex; align-items:center; gap:.35rem; cursor:pointer;
  background:transparent; border:1px solid var(--rule); border-radius:2px;
  padding:.15rem .45rem; color:var(--ink); font:inherit; font-size:.7rem;
}
.skey:hover{background:var(--panel)}
.skey:focus-visible{outline:1px solid var(--lit); outline-offset:1px}
.skey[aria-pressed="false"]{opacity:.32}
.skey i{width:9px; height:9px; border-radius:2px; display:block}

/* 交通機関の行 */
.row{
  display:block; width:100%; text-align:left; cursor:pointer;
  background:none; border:0; border-top:1px solid var(--rule);
  padding:.42rem .1rem .45rem; color:var(--ink); font:inherit;
}
.row:first-of-type{border-top:0}
.row:hover{background:var(--panel)}
.row:focus-visible{outline:1px solid var(--lit); outline-offset:-1px}
.row[aria-pressed="false"]{opacity:.32}
.row-h{display:flex; align-items:baseline; gap:.5rem; margin-bottom:.25rem}
.row-h b{font-weight:500; font-size:.8rem}
.row-h span{
  margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:.66rem;
  color:var(--ink-3); font-variant-numeric:tabular-nums;
}
.bar{display:flex; height:7px; border-radius:1px; overflow:hidden; background:var(--night)}
.bar i{display:block; height:100%}
.nums{
  display:flex; gap:.4rem; margin-top:.25rem; font-family:"IBM Plex Mono",monospace;
  font-size:.67rem; font-variant-numeric:tabular-nums; flex-wrap:wrap;
}
.nums u{text-decoration:none; white-space:nowrap}
.nums .none{color:var(--ink-3)}
#side .foot{
  font-size:.64rem; color:var(--ink-3); margin:.7rem 0 0; padding-top:.5rem;
  border-top:1px solid var(--rule); line-height:1.6;
}

/* 操作 */
#controls{right:1rem; top:1rem; display:flex; flex-direction:column; align-items:flex-end; gap:.5rem}
.zoom{display:flex; gap:.3rem}
.zoom button{
  width:2rem; height:2rem; font:inherit; font-size:1rem; cursor:pointer; line-height:1;
  background:rgba(14,23,32,.93); color:var(--ink-2); border:1px solid var(--rule); border-radius:3px;
}
.zoom button:hover{color:var(--ink)}

/* 情報 */
#info{
  left:50%; transform:translateX(-50%); bottom:1rem;
  padding:.7rem .9rem; width:min(30rem, calc(100% - 2rem));
}
#info dl{grid-template-columns:auto 1fr auto 1fr}
#info .hint{color:var(--ink-3); font-size:.75rem; margin:0}
#info dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:.15rem .7rem; font-size:.78rem}
#info .ttl{display:inline}
#info .badge{margin-left:.6rem}
#info dt{color:var(--ink-3); font-size:.72rem}
#info dd{margin:0}
#info .ttl{font-size:.95rem; font-weight:700; margin:0 0 .45rem; line-height:1.4}
#info .badge{
  display:inline-block; font-size:.68rem; padding:.1rem .45rem; border-radius:2px;
  border:1px solid currentColor; margin-bottom:.5rem;
}
footer{
  position:absolute; left:1rem; top:1rem; z-index:2; font-size:.7rem; color:var(--ink-3);
  max-width:23rem; line-height:1.55;
}
footer b{color:var(--ink-2); font-weight:500}
#fallback{
  position:absolute; inset:0; display:none; place-items:center; text-align:center;
  padding:2rem; color:var(--ink-2); font-size:.85rem;
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
@media (max-width:900px){
  .stage{display:block}
  #side{width:auto; border-right:0; border-bottom:1px solid var(--rule)}
  header{gap:.8rem; padding:.85rem 1rem .65rem}
  #info{display:none}
  }
</style>

<header>
  <div class="brand">
    <h1>交通データ夜景図</h1>
    <p>公共交通オープンデータの整備状況 ／ 実測 2026-09-09</p>
  </div>
</header>

<div class="stage">
  <aside id="side">
    <h2>データの所在</h2>
    <div id="statuskeys"></div>
    <h2 class="mt">交通機関ごとの内訳</h2>
    <div id="keys"></div>
    <p class="foot" id="legend-foot"></p>
  </aside>

  <div class="mapwrap">
  <canvas id="map"></canvas>
  <div id="fallback">
    <p>この端末では WebGL が使えないため、地図を表示できません。</p>
  </div>

  <footer>
    薄い輪郭は海岸線。<b>その上はすべて交通機関で、明るいほどデータが揃っています。</b><br>
    <span id="legend-foot"></span>沖縄は縮小すると視野に入ります。
  </footer>

  <div id="controls" class="overlay">
    <div class="zoom">
      <button id="zin" type="button" aria-label="拡大">＋</button>
      <button id="zout" type="button" aria-label="縮小">−</button>
      <button id="zreset" type="button" aria-label="全体表示" style="width:auto;padding:0 .5rem;font-size:.72rem">全体</button>
    </div>
  </div>

  <div id="info" class="overlay card">
    <p class="hint">鉄道の路線にカーソルを合わせると、事業者名とデータの状態が出ます。</p>
  </div>
  </div>
</div>

<script id="rail" type="application/json">/*__GEOJSON__*/</script>
<script id="bus" type="application/json">/*__BUS__*/</script>
<script id="layers" type="application/json">/*__LAYERS__*/</script>
<script id="coast" type="application/json">/*__COAST__*/</script>
<script id="summary" type="application/json">/*__SUMMARY__*/</script>
<script id="pref" type="application/json">/*__PREF__*/</script>
<!--__ENGINE__-->
